{% load static %}

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pagar pedidos</title>
    <link rel="stylesheet" href="/static/css/pagar.css">
</head>
<body>

<h1>Pagar pedidos</h1>

<label>Selecione o cliente:</label>
<select id="cliente">
    <option value="">— selecione —</option>
    {% for c in clientes %}
    <option value="{{ c.id }}">{{ c.nome_completo }}</option>
    {% endfor %}
</select>

<button onclick="buscarPedidos()">Buscar pedidos</button>

<div id="lista"></div>

<button id="btn-pagar" onclick="confirmarPagamento()" style="display:none;">
    Pagar pedidos selecionados
</button>

<script>
function buscarPedidos() {
    const cliente = document.getElementById("cliente").value;

    if (!cliente) {
        alert("Selecione um cliente primeiro.");
        return;
    }

    fetch("/pagar_listar/", {
        method: "POST",
        body: JSON.stringify({ cliente }),
        headers: {"Content-Type": "application/json"}
    })
    .then(r => r.json())
    .then(res => {
        if (!res.ok) {
            alert(res.erro || "Erro ao buscar pedidos.");
            return;
        }

        let html = "<h3>Pedidos em aberto:</h3>";

        if (res.pedidos.length === 0) {
            html += "<p>Não há pedidos em aberto para este cliente.</p>";
            document.getElementById("lista").innerHTML = html;
            document.getElementById("btn-pagar").style.display = "none";
            return;
        }

        res.pedidos.forEach(p => {
            html += `
                <div class="item-pedido">
                    <input type="checkbox" class="pedido-check" value="${p.id}">
                    
                    <strong>Pedido ${p.id}</strong><br>

                    📅 Feito em: <b>${p.data_pedido}</b><br>
                    🧾 Vencimento: <b>${p.data_cobranca}</b><br>
                    💰 Valor: <b>R$ ${p.total.toFixed(2).replace('.', ',')}</b><br>

                    🛍 Itens:<br>
                    <ul>
                        ${p.itens.map(i => `<li>${i}</li>`).join("")}
                    </ul>
                </div>
                <hr>
            `;
        });

        document.getElementById("lista").innerHTML = html;
        document.getElementById("btn-pagar").style.display = "block";
    });
}

function confirmarPagamento() {
    const selecionados = [...document.querySelectorAll(".pedido-check:checked")].map(e => e.value);

    if (selecionados.length === 0) {
        alert("Selecione pelo menos um pedido para pagar.");
        return;
    }

    const ref = selecionados.join(",");
    window.location.href = `/pix/?ref=${encodeURIComponent(ref)}`;
}
</script>

</body>
</html>
