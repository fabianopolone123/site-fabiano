{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loja Interna</title>
    <link rel="stylesheet" href="/static/css/home.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<!-- BARRA SUPERIOR (NAVBAR) -->
<div class="topbar">
    <h2>Minha Loja Interna</h2>

    <div class="menu">
        <a href="#">Produtos</a>
        <a href="#">Ajuda</a>

        <!-- NOVO BOTÃO PAGAR PEDIDOS -->
        <a href="/pagar/" class="menu-link">Pagar pedidos</a>

        <!-- ÍCONE DO CARRINHO -->
        <div class="carrinho-icone" onclick="window.location='/carrinho/'">
            🛒 <span id="carrinho-count">0</span>
        </div>
    </div>
</div>

<!-- LISTA DE PRODUTOS -->
<div id="lista-produtos">

    {% for p in produtos %}
    <div class="produto">

        <img src="{{ p.imagem.url }}" alt="{{ p.nome }}">

        <h3>{{ p.nome }}</h3>
        <p class="preco">Preço: R$ {{ p.preco }}</p>
        <p class="estoque" data-estoque="{{ p.estoque }}">Estoque: {{ p.estoque }}</p>

        <div class="qtd-controle">
            <button class="btn-menos">-</button>
            <span class="qtd">1</span>
            <button class="btn-mais">+</button>
        </div>

        <button class="btn-add">Adicionar ao Carrinho</button>
    </div>
    {% endfor %}

</div>

<script src="/static/js/home.js"></script>

</body>
</html>
